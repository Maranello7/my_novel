<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ創作ノート</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuODnuOCpOaJm-S9nOpatchesiIiwKICAic2hvcnRfbmFtZSI6ICLnmLPlipPjg4bjg4kiLAogICJzdGFydF91cmwiOiAiaW5kZXguaHRtbCIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2Y0ZWZlNiIsCiAgInRoZW1lX2NvbG9yIjogIiM1YzQwMzMiCgp9">
  <style>
    :root {
      --bg-main: #f4efe6;
      --bg-paper: #fbf8f3;
      --bg-sidebar: #e8dfd1;
      --accent-brown: #5c4033;
      --accent-warm: #8b5a2b;
      --border-color: #dcd3c5;
      --text-color: #2c221e;
      --text-sub: #665c54;
      --sticky-yellow: #fef3bd;
      --shadow: 0 4px 15px rgba(92, 64, 51, 0.08);
      --border-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      background-color: var(--bg-main);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    header {
      background: var(--bg-paper);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.1rem; font-weight: bold; color: var(--accent-brown); display: flex; align-items: center; gap: 8px; }
    .menu-btn { background: none; border: none; font-size: 1.4rem; color: var(--accent-brown); cursor: pointer; padding: 4px; }

    /* メインコンテナ */
    .container { max-width: 750px; margin: 0 auto; width: 100%; padding: 20px 16px; flex: 1; }
    .page { display: none; }
    .page.active { display: block; }

    /* ボタンデザイン */
    .btn {
      background: var(--accent-warm); color: var(--bg-paper);
      padding: 10px 18px; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center;
      transition: opacity 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { opacity: 0.8; }
    .btn-small { padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; }
    .btn-danger { background: #b71c1c; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; color: var(--accent-brown);
      font-size: 0.95rem; font-weight: bold; cursor: pointer; padding: 8px 0; margin-bottom: 16px;
    }

    /* フォーム要素 */
    input, textarea, select {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border-color);
      border-radius: 8px; font-size: 0.95rem; margin-top: 6px; margin-bottom: 12px;
      outline: none; background: var(--bg-paper); color: var(--text-color);
      font-family: inherit;
    }

    /* ホーム画面カード */
    .hero-title { text-align: center; margin: 15px 0 25px; }
    .hero-title h1 { font-size: 1.4rem; color: var(--accent-brown); font-weight: 600; letter-spacing: 2px; }
    .hero-title p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    .menu-list { display: flex; flex-direction: column; gap: 14px; }
    .menu-card {
      background: var(--bg-paper); border-radius: var(--border-radius); padding: 18px;
      display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow);
      cursor: pointer; border: 1px solid var(--border-color); transition: transform 0.2s;
    }
    .menu-card:active { transform: scale(0.98); }
    .icon-box {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--bg-sidebar); color: var(--accent-brown);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0;
    }
    .menu-info { flex-grow: 1; }
    .menu-info h3 { font-size: 1.05rem; color: var(--accent-brown); margin-bottom: 3px; }
    .menu-info p { font-size: 0.8rem; color: var(--text-sub); }

    /* スライドアウト・サイドバー (ドロワー) */
    #sidebar {
      position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
      background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color);
      z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column;
      box-shadow: var(--shadow);
    }
    #sidebar.open { left: 0; }
    .sidebar-header {
      padding: 18px 20px; background-color: var(--accent-brown); color: var(--bg-paper);
      font-size: 1.05rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center;
    }
    .nav-list { list-style: none; padding: 10px 0; overflow-y: auto; flex: 1; }
    .nav-item {
      padding: 12px 20px; cursor: pointer; font-size: 0.95rem; color: var(--text-color);
      display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(0,0,0,0.03);
    }
    .nav-item:active, .nav-item.active { background-color: var(--border-color); color: var(--accent-brown); font-weight: bold; }
    .chapter-nav-item { padding-left: 36px; font-size: 0.88rem; color: var(--text-sub); }

    #overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); z-index: 999; display: none; }
    #overlay.active { display: block; }

    /* 共通バー */
    .book-selector-bar {
      background: var(--bg-sidebar); padding: 10px 14px; border-radius: 8px;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-color);
    }

    /* 本棚リスト */
    .bookshelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; padding: 10px 0; }
    .book-item {
      background: var(--accent-warm); color: var(--bg-paper); height: 170px;
      border-radius: 4px 8px 8px 4px; padding: 14px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer; box-shadow: 2px 4px 8px rgba(0,0,0,0.12);
      border-left: 6px solid var(--accent-brown); position: relative;
    }

    /* 執筆・読書エリア */
    .book-paper {
      background-color: var(--bg-paper); border: 1px solid var(--border-color);
      border-radius: 6px; padding: 24px 20px; min-height: 400px; box-shadow: var(--shadow);
      line-height: 1.9; font-size: 1.05rem; position: relative;
    }
    .writing-vertical { writing-mode: vertical-rl; height: 520px; overflow-x: auto; width: 100%; }
    
    /* 読書用装飾（章タイトル・栞） */
    .read-content h1, .read-content h2 {
      color: var(--accent-brown); font-weight: bold; margin: 24px 0 12px;
      border-bottom: 2px solid var(--accent-warm); padding-bottom: 4px; line-height: 1.3;
    }
    .read-content h1 { font-size: 1.5rem; }
    .read-content h2 { font-size: 1.3rem; }
    .bookmark-flag {
      display: inline-block; background: var(--accent-brown); color: #fff;
      padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-left: 8px; vertical-align: middle;
    }

    /* 設定・アイディア表示 */
    .setting-category-block { background: var(--bg-paper); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .idea-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
    .idea-sticky {
      background-color: var(--sticky-yellow); padding: 12px; border-radius: 4px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; min-height: 120px;
    }

    /* モーダル */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); justify-content:center; align-items:center; z-index:2000; padding:16px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-paper); padding: 20px; border-radius: var(--border-radius); width: 100%; max-width: 380px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <!-- オーバーレイ -->
  <div id="overlay" onclick="toggleSidebar(false)"></div>

  <!-- スライドアウト サイドバー（スワイプ＆目次対応） -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <span>メニュー & 目次</span>
      <span style="cursor:pointer;" onclick="toggleSidebar(false)">✕</span>
    </div>
    <ul class="nav-list" id="sidebar-nav-list">
      <!-- JSでメインメニューと「読書中の章一覧」が挿入されます -->
    </ul>
  </nav>

  <!-- ヘッダー -->
  <header>
    <div class="logo">🌿 マイ創作ノート</div>
    <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
  </header>

  <div class="container">

    <!-- 1. ホーム画面 -->
    <div id="page-home" class="page active">
      <div class="hero-title">
        <p>MY STORY STUDIO</p>
        <h1>言葉を紡ぎ、本を創る時間</h1>
      </div>
      <div class="menu-list">
        <div class="menu-card" onclick="openNewBookModal()">
          <div class="icon-box">➕</div>
          <div class="menu-info">
            <h3>新規作品を作成</h3>
            <p>題名を決めて新しい物語やエッセイを書き始める</p>
          </div>
          <span>🍃</span>
        </div>
        <div class="menu-card" onclick="navigateTo('edit')">
          <div class="icon-box">✏️</div>
          <div class="menu-info">
            <h3>物語編集</h3>
            <p>執筆中の作品の続きを書く・推敲する</p>
          </div>
          <span>🌿</span>
        </div>
        <div class="menu-card" onclick="navigateTo('settings')">
          <div class="icon-box">🏛️</div>
          <div class="menu-info">
            <h3>物語の設定</h3>
            <p>国、登場人物、魔法、世界観設定メモ</p>
          </div>
          <span>🍀</span>
        </div>
        <div class="menu-card" onclick="navigateTo('ideas')">
          <div class="icon-box">💡</div>
          <div class="menu-info">
            <h3>物語別アイディア</h3>
            <p>プロット、伏線、ひらめき付箋メモ</p>
          </div>
          <span>🌱</span>
        </div>
        <div class="menu-card" onclick="navigateTo('read')">
          <div class="icon-box">📖</div>
          <div class="menu-info">
            <h3>創作物を読む（本棚）</h3>
            <p>章目次ナビ・栞機能でじっくり読書する</p>
          </div>
          <span>📚</span>
        </div>
      </div>
    </div>

    <!-- 2. 執筆画面（物語編集） -->
    <div id="page-edit" class="page">
      <button class="back-btn" onclick="history.back()">← ホームへ戻る</button>
      <div class="book-selector-bar">
        <select id="edit-book-select" onchange="onEditorBookChange()"></select>
        <button class="btn btn-small" onclick="renameCurrentBook()">✏️ リネーム</button>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <button class="btn btn-small" onclick="toggleWritingMode()">縦書き / 横書き</button>
        <button class="btn btn-small" onclick="saveEditorText(true)">💾 保存</button>
      </div>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:6px;">※ 行頭に「# 第一章 章名」と書くと章の見出しになり、目次に登録されます。</p>
      <div class="book-paper" id="editor-paper">
        <textarea id="editor-textarea" style="border:none; background:transparent; height:380px; resize:none;" placeholder="ここから物語を書き始めましょう..." oninput="autoSaveText()"></textarea>
      </div>
    </div>

    <!-- 3. 物語の設定画面 -->
    <div id="page-settings" class="page">
      <button class="back-btn" onclick="history.back()">← ホームへ戻る</button>
      <div class="book-selector-bar">
        <select id="settings-book-select" onchange="renderSettings()"></select>
        <button class="btn btn-small" onclick="addSettingCategory()" style="margin-left:auto;">+ カテゴリ追加</button>
      </div>
      <div id="settings-container"></div>
    </div>

    <!-- 4. 物語別アイディア画面 -->
    <div id="page-ideas" class="page">
      <button class="back-btn" onclick="history.back()">← ホームへ戻る</button>
      <div class="book-selector-bar">
        <select id="ideas-book-select" onchange="renderIdeas()"></select>
      </div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="new-idea-input" placeholder="ひらめいたアイディアを入力...">
        <button class="btn" style="white-space:nowrap; height:42px; margin-top:6px;" onclick="addIdea()">貼る</button>
      </div>
      <div class="idea-board" id="idea-board"></div>
    </div>

    <!-- 5. 読書画面（本棚 ＆ 読書ビュー） -->
    <div id="page-read" class="page">
      <button class="back-btn" onclick="history.back()">← ホームへ戻る</button>
      <div id="read-shelf-view">
        <h3>完成・執筆中の作品（本棚）</h3>
        <div class="bookshelf-grid" id="bookshelf-grid"></div>
      </div>

      <div id="read-reader-view" style="display:none;">
        <div class="book-selector-bar">
          <strong id="reader-book-title" style="color:var(--accent-brown); font-size:1.1rem;"></strong>
          <button class="btn btn-small" style="margin-left:auto;" onclick="renameCurrentBook('read')">✏️ リネーム</button>
          <button class="btn btn-small" onclick="closeReader()">本棚へ</button>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <button class="btn btn-small" onclick="setBookmark()">🔖 ここに栞を挟む</button>
          <button class="btn btn-small" onclick="jumpToBookmark()">🔖 栞へジャンプ</button>
        </div>
        <div class="book-paper read-content" id="reader-paper"></div>
      </div>
    </div>

  </div>

  <!-- 新規作成モーダル -->
  <div id="new-book-modal" class="modal">
    <div class="modal-content">
      <h3>新しい作品の題名</h3>
      <input type="text" id="new-book-title" placeholder="作品のタイトル...">
      <button class="btn" style="width:100%; margin-top:8px;" onclick="createNewBook()">作成して執筆を始める</button>
      <button class="back-btn" style="width:100%; text-align:center; margin-top:8px;" onclick="closeNewBookModal()">キャンセル</button>
    </div>
  </div>

  <script>
    /* ==========================================
       データ構造 ＆ localStorage 自動保存
       ========================================== */
    const STORAGE_KEY = 'my_novels_master_data';
    
    let defaultData = {
      currentBookId: 1,
      books: [
        {
          id: 1,
          title: "グランベルク戦記",
          content: "# 第一章 王国の黄昏\n広大な大陸の東方に位置するグランベルク王国。その古き城塞都市に、静かに朝靄が立ち込めていた……\n\n## 1. 旅立ちの予感\n若い騎士のアルスは、静かに剣を磨きながら遠くの山並みを見つめていた。\n\n# 第二章 帝国の影\n東方の境界線に、黒き鎧をまとった帝国軍が集結しつつあった。",
          bookmarkPos: 0,
          settings: [
            { categoryName: "国・勢力", items: [{ name: "グランベルク王国", details: { "国力": "中規模", "騎士団": "聖幻騎士団" } }] }
          ],
          ideas: [
            { id: 101, text: "ライバルは帝国の第三皇子にする？", date: "2026/10/06" }
          ]
        }
      ]
    };

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    let isVertical = false;
    let currentChapterList = [];

    /* ==========================================
       画面遷移・ブラウザバック（戻る）管理
       ========================================== */
    function navigateTo(pageId, isBack = false) {
      // モーダルが開いていれば閉じる
      closeNewBookModal();

      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const targetPage = document.getElementById('page-' + pageId);
      if (targetPage) targetPage.classList.add('active');

      if (!isBack) {
        history.pushState({ page: pageId }, '', '#' + pageId);
      }

      updateAllBookSelectors();

      if (pageId === 'edit') loadEditorText();
      if (pageId === 'settings') renderSettings();
      if (pageId === 'ideas') renderIdeas();
      if (pageId === 'read') renderBookshelf();

      renderSidebarNav(pageId);
    }

    window.onpopstate = function(event) {
      if (event.state && event.state.page) {
        navigateTo(event.state.page, true);
      } else {
        navigateTo('home', true);
      }
    };

    window.onload = function() {
      initDrawerSwipe();
      history.replaceState({ page: 'home' }, '', '#home');
      renderSidebarNav('home');
    };

    /* ==========================================
       スライドアウト・左スワイプメニュー
       ========================================== */
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    let touchStartX = 0;

    function toggleSidebar(open) {
      if (open) {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      } else {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }
    }

    function initDrawerSwipe() {
      document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
      document.addEventListener('touchend', e => {
        let touchEndX = e.changedTouches[0].clientX;
        if (touchStartX < 40 && touchEndX - touchStartX > 60) toggleSidebar(true);
        if (sidebar.classList.contains('open') && touchStartX - touchEndX > 60) toggleSidebar(false);
      });
    }

    function renderSidebarNav(currentPage) {
      const nav = document.getElementById('sidebar-nav-list');
      let html = `
        <li class="nav-item ${currentPage==='home'?'active':''}" onclick="navigateTo('home')">🏠 ホーム</li>
        <li class="nav-item ${currentPage==='edit'?'active':''}" onclick="navigateTo('edit')">✏️ 物語編集</li>
        <li class="nav-item ${currentPage==='settings'?'active':''}" onclick="navigateTo('settings')">🏛️ 物語の設定</li>
        <li class="nav-item ${currentPage==='ideas'?'active':''}" onclick="navigateTo('ideas')">💡 物語別アイディア</li>
        <li class="nav-item ${currentPage==='read'?'active':''}" onclick="navigateTo('read')">📖 本棚（読書）</li>
      `;

      // 読書画面かつ本を開いている場合、章目次を追加挿入
      if (currentPage === 'read' && document.getElementById('read-reader-view').style.display !== 'none') {
        html += `<li class="nav-item" style="background:var(--accent-brown); color:#fff; font-weight:bold; margin-top:10px;">📚 この本の章目次</li>`;
        if (currentChapterList.length === 0) {
          html += `<li class="nav-item chapter-nav-item">（章見出しがありません）</li>`;
        } else {
          currentChapterList.forEach((ch, idx) => {
            html += `<li class="nav-item chapter-nav-item" onclick="scrollToChapter(${idx})">${escapeHTML(ch.title)}</li>`;
          });
        }
      }

      nav.innerHTML = html;
    }

    /* ==========================================
       本（作品）共通操作・リネーム
       ========================================== */
    function updateAllBookSelectors() {
      const selects = ['edit-book-select', 'settings-book-select', 'ideas-book-select'];
      selects.forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = "";
        appData.books.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.innerText = b.title;
          if (b.id === appData.currentBookId) opt.selected = true;
          sel.appendChild(opt);
        });
      });
    }

    function getCurrentBook() {
      return appData.books.find(b => b.id === appData.currentBookId) || appData.books[0];
    }

    function renameCurrentBook(fromView) {
      const book = getCurrentBook();
      if (!book) return;
      const newTitle = prompt("新しい作品名（タイトル）を入力してください:", book.title);
      if (newTitle && newTitle.trim()) {
        book.title = newTitle.trim();
        saveData();
        updateAllBookSelectors();
        if (fromView === 'read') {
          document.getElementById('reader-book-title').innerText = book.title;
          renderBookshelf();
        }
      }
    }

    // 新規作成モーダル
    function openNewBookModal() {
      document.getElementById('new-book-modal').classList.add('active');
      document.getElementById('new-book-title').focus();
    }
    function closeNewBookModal() {
      document.getElementById('new-book-modal').classList.remove('active');
      document.getElementById('new-book-title').value = '';
    }

    function createNewBook() {
      const title = document.getElementById('new-book-title').value.trim();
      if (!title) { alert('題名を入力してください'); return; }

      const newBook = {
        id: Date.now(),
        title: title,
        content: "# 第一章 \nここに本文を書きます...",
        bookmarkPos: 0,
        settings: [],
        ideas: []
      };

      appData.books.push(newBook);
      appData.currentBookId = newBook.id;
      saveData();

      closeNewBookModal();
      navigateTo('edit');
    }

    /* ==========================================
       2. 執筆機能（編集・自動保存）
       ========================================== */
    function onEditorBookChange() {
      saveEditorText(false);
      appData.currentBookId = parseInt(document.getElementById('edit-book-select').value);
      loadEditorText();
      saveData();
    }

    function loadEditorText() {
      const book = getCurrentBook();
      if (book) {
        document.getElementById('editor-textarea').value = book.content || '';
      }
    }

    function autoSaveText() {
      const book = getCurrentBook();
      if (book) {
        book.content = document.getElementById('editor-textarea').value;
        saveData();
      }
    }

    function saveEditorText(showMsg = true) {
      autoSaveText();
      if (showMsg) alert("保存しました！");
    }

    function toggleWritingMode() {
      const paper = document.getElementById('editor-paper');
      isVertical = !isVertical;
      if (isVertical) {
        paper.classList.add('writing-vertical');
      } else {
        paper.classList.remove('writing-vertical');
      }
    }

    /* ==========================================
       3. 物語の設定（自由項目追加）
       ========================================== */
    function renderSettings() {
      const bookId = parseInt(document.getElementById('settings-book-select').value);
      appData.currentBookId = bookId;
      const book = getCurrentBook();
      const container = document.getElementById('settings-container');
      container.innerHTML = "";

      if (!book.settings || book.settings.length === 0) {
        container.innerHTML = `<p style="color:#777; padding:10px;">設定がありません。「+ カテゴリ追加」から登録できます。</p>`;
        return;
      }

      book.settings.forEach((cat, catIdx) => {
        const block = document.createElement('div');
        block.className = 'setting-category-block';
        
        let itemsHtml = "";
        cat.items.forEach((item, itemIdx) => {
          let detailsHtml = "";
          for (let [k, v] of Object.entries(item.details || {})) {
            detailsHtml += `<div style="font-size:0.88rem; margin-top:4px;"><strong style="color:var(--accent-brown);">${escapeHTML(k)}:</strong> ${escapeHTML(v)}</div>`;
          }

          itemsHtml += `
            <div style="background:var(--bg-main); padding:10px; border-radius:6px; margin-top:8px; border-left:3px solid var(--accent-warm);">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${escapeHTML(item.name)}</strong>
                <button class="btn btn-small btn-danger" onclick="deleteSettingItem(${catIdx}, ${itemIdx})">削除</button>
              </div>
              ${detailsHtml}
              <button class="btn btn-small" style="margin-top:6px;" onclick="addFieldToItem(${catIdx}, ${itemIdx})">+ 属性追加</button>
            </div>
          `;
        });

        block.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--accent-warm); padding-bottom:6px;">
            <strong style="font-size:1.1rem; color:var(--accent-brown);">${escapeHTML(cat.categoryName)}</strong>
            <button class="btn btn-small" onclick="addSettingItem(${catIdx})">+ 項目の追加</button>
          </div>
          ${itemsHtml}
        `;
        container.appendChild(block);
      });
    }

    function addSettingCategory() {
      const book = getCurrentBook();
      const name = prompt("新しい設定カテゴリ名 (例: 国, 魔法, 登場人物):");
      if (!name) return;
      if (!book.settings) book.settings = [];
      book.settings.push({ categoryName: name, items: [] });
      saveData();
      renderSettings();
    }

    function addSettingItem(catIdx) {
      const book = getCurrentBook();
      const name = prompt("項目の名前を入力してください:");
      if (!name) return;
      book.settings[catIdx].items.push({ name: name, details: {} });
      saveData();
      renderSettings();
    }

    function addFieldToItem(catIdx, itemIdx) {
      const book = getCurrentBook();
      const key = prompt("属性名 (例: 国力, 所属, 技名):");
      if (!key) return;
      const val = prompt(`${key} の内容:`);
      if (val === null) return;
      book.settings[catIdx].items[itemIdx].details[key] = val;
      saveData();
      renderSettings();
    }

    function deleteSettingItem(catIdx, itemIdx) {
      const book = getCurrentBook();
      if (confirm("削除しますか？")) {
        book.settings[catIdx].items.splice(itemIdx, 1);
        saveData();
        renderSettings();
      }
    }

    /* ==========================================
       4. アイディアメモ機能
       ========================================== */
    function renderIdeas() {
      const bookId = parseInt(document.getElementById('ideas-book-select').value);
      appData.currentBookId = bookId;
      const book = getCurrentBook();
      const board = document.getElementById('idea-board');
      board.innerHTML = "";

      if (!book.ideas || book.ideas.length === 0) {
        board.innerHTML = `<p style="color:#777; grid-column:1/-1;">アイディアメモはありません。</p>`;
        return;
      }

      book.ideas.forEach(idea => {
        const sticky = document.createElement('div');
        sticky.className = 'idea-sticky';
        sticky.innerHTML = `
          <div style="font-size:0.9rem; white-space:pre-wrap;">${escapeHTML(idea.text)}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:0.75rem; color:#777;">
            <span>${idea.date}</span>
            <button class="btn btn-small btn-danger" onclick="deleteIdea(${idea.id})">削除</button>
          </div>
        `;
        board.appendChild(sticky);
      });
    }

    function addIdea() {
      const book = getCurrentBook();
      const input = document.getElementById('new-idea-input');
      const text = input.value.trim();
      if (!text) return;

      if (!book.ideas) book.ideas = [];
      const now = new Date();
      book.ideas.push({
        id: Date.now(),
        text: text,
        date: `${now.getMonth()+1}/${now.getDate()}`
      });

      input.value = "";
      saveData();
      renderIdeas();
    }

    function deleteIdea(id) {
      const book = getCurrentBook();
      book.ideas = book.ideas.filter(i => i.id !== id);
      saveData();
      renderIdeas();
    }

    /* ==========================================
       5. 本棚 ＆ 読書モード（章抽出・栞機能）
       ========================================== */
    function renderBookshelf() {
      const grid = document.getElementById('bookshelf-grid');
      grid.innerHTML = "";
      appData.books.forEach(book => {
        const item = document.createElement('div');
        item.className = 'book-item';
        item.innerHTML = `
          <div style="font-weight:bold; font-size:1.05rem; line-height:1.3;">${escapeHTML(book.title)}</div>
          <div style="font-size:0.75rem; opacity:0.8;">📖 タップして読む</div>
        `;
        item.onclick = () => openReader(book.id);
        grid.appendChild(item);
      });
    }

    function openReader(bookId) {
      appData.currentBookId = bookId;
      const book = getCurrentBook();

      document.getElementById('read-shelf-view').style.display = 'none';
      document.getElementById('read-reader-view').style.display = 'block';
      document.getElementById('reader-book-title').innerText = book.title;

      parseAndRenderChapters(book.content);
      renderSidebarNav('read');
    }

    function closeReader() {
      document.getElementById('read-reader-view').style.display = 'none';
      document.getElementById('read-shelf-view').style.display = 'block';
      renderSidebarNav('read');
    }

    // 本文から章(#)をパースして大きめ表示＆リスト化
    function parseAndRenderChapters(rawText) {
      const container = document.getElementById('reader-paper');
      container.innerHTML = "";
      currentChapterList = [];

      if (!rawText) {
        container.innerHTML = "<p style='color:#888;'>本文がまだありません。</p>";
        return;
      }

      const lines = rawText.split('\n');
      let chapterCount = 0;

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (trimmed.startsWith('# ')) {
          chapterCount++;
          const title = trimmed.replace('# ', '');
          currentChapterList.push({ id: `chap-${chapterCount}`, title: title });

          const h1 = document.createElement('h1');
          h1.id = `chap-${chapterCount}`;
          h1.innerText = title;
          container.appendChild(h1);
        } else if (trimmed.startsWith('## ')) {
          chapterCount++;
          const title = trimmed.replace('## ', '');
          currentChapterList.push({ id: `chap-${chapterCount}`, title: title });

          const h2 = document.createElement('h2');
          h2.id = `chap-${chapterCount}`;
          h2.innerText = title;
          container.appendChild(h2);
        } else {
          const p = document.createElement('p');
          p.style.marginBottom = '12px';
          p.innerText = line;
          container.appendChild(p);
        }
      });
    }

    function scrollToChapter(index) {
      const chap = currentChapterList[index];
      if (chap) {
        const el = document.getElementById(chap.id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
      toggleSidebar(false);
    }

    // 栞（しおり）機能
    function setBookmark() {
      const book = getCurrentBook();
      const scrollPos = window.scrollY || document.documentElement.scrollTop;
      book.bookmarkPos = scrollPos;
      saveData();
      alert("🔖 この位置に栞を挟みました！");
    }

    function jumpToBookmark() {
      const book = getCurrentBook();
      if (book && book.bookmarkPos !== undefined) {
        window.scrollTo({ top: book.bookmarkPos, behavior: 'smooth' });
      } else {
        alert("栞が挟まれていません。");
      }
    }

    // ユーティリティ
    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
